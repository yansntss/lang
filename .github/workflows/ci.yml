name: CI

on:
  push:
    branches: [main]
  pull_request:

# O token do workflow só lê o repositório; nada aqui precisa escrever.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes, lint e build
    runs-on: windows-latest
    timeout-minutes: 45
    # As ações ficam fixadas por commit (o comentário diz a versão): uma tag móvel poderia mudar
    # de conteúdo sem que este arquivo mudasse.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Dependências do front
        run: npm ci

      - name: Versão igual nos três arquivos
        run: npm run check:version

      - name: Tipos (tsc)
        run: npx tsc --noEmit

      - name: Testes do front
        run: npm test

      # O Rust embute o front compilado (`frontendDist`), então o build do front vem antes.
      - name: Build do front
        run: npm run build

      - name: Formatação (rustfmt)
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Testes de Rust
        run: cargo test
        working-directory: src-tauri

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Vulnerabilidades do npm
        run: npm audit --audit-level=high

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Vulnerabilidades do Rust
        run: cargo audit
        working-directory: src-tauri
