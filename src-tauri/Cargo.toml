[package]
name = "lang"
version = "0.1.0"
description = "Tradutor por atalho: traduz o texto selecionado entre inglês e português"
authors = ["yansntss"]
license = "MIT"
repository = "https://github.com/yansntss/lang"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Só para o tipo `ResizeDirection`, que o crate `tauri` não reexporta; já vem com o `tauri`.
tauri-runtime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
whatlang = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
log = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
# Recorte e ampliação da imagem antes do OCR (sem codecs: a imagem nunca vai para arquivo).
image = { version = "0.25", default-features = false }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
tempfile = "3"
# Só para o teste do OCR real ler a imagem de exemplo em `tests/fixtures`.
image = { version = "0.25", default-features = false, features = ["png"] }

# Captura de tela para a leitura de região (OCR). Fora do Linux por enquanto: lá ele exige
# PipeWire e XCB, e a captura ainda não é suportada.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
xcap = "0.9.8"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
